services:
  postgres:
    image: postgres:16-alpine
    container_name: wayfarer-postgres
    environment:
      POSTGRES_USER: wayfarer
      POSTGRES_PASSWORD: wayfarer_local_only
      POSTGRES_DB: wayfarer
    ports:
      - "5433:5432"
    volumes:
      - wayfarer_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wayfarer -d wayfarer"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  wayfarer_pgdata:
